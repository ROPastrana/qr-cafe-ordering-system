<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111113">
    <!-- When the PHP backend is connected, add a server-generated CSRF token here:
         <meta name="csrf-token" content="..."> -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/tailwind.css">
    <title>QR Cafe | Slow coffee. Good moments.</title>
    <meta name="description" content="Order specialty drinks and freshly baked pastries from your table. No app, no login.">
  </head>
  <body>
    <main class="app-shell splash-shell screen-enter">
      <img
        class="splash-image"
        src="https://images.unsplash.com/photo-1762657440603-67275ae3f7f8?crop=entropy&amp;cs=tinysrgb&amp;fit=max&amp;fm=jpg&amp;q=85&amp;w=1800"
        alt="Barista pouring milk into a cup of coffee"
      >
      <div class="splash-overlay"></div>

      <!-- Top: logo mark + wordmark -->
      <div class="splash-top">
        <svg class="logo" width="36" height="36" viewBox="0 0 36 36" fill="none" aria-hidden="true">
            <circle class="logo-bg" cx="18" cy="18" r="18" />
            <path d="M11 16h14l-2 8H13l-2-8Z" stroke="white" stroke-width="1.6" stroke-linejoin="round" />
            <path d="M25 18.5c2 0 3 1 3 2.5s-1 2.5-3 2.5" stroke="white" stroke-width="1.6" stroke-linecap="round" />
            <path d="M15 13.5c0-1 1-1.5 1-2.5" stroke="white" stroke-width="1.4" stroke-linecap="round" />
            <path d="M18 13.5c0-1 1-1.5 1-2.5" stroke="white" stroke-width="1.4" stroke-linecap="round" />
            <path d="M21 13.5c0-1 1-1.5 1-2.5" stroke="white" stroke-width="1.4" stroke-linecap="round" />
          </svg>
        <div>
          <p class="splash-brand__name">QR Cafe</p>
          <p class="splash-brand__tag">Specialty Coffee</p>
        </div>
      </div>

      <!-- Bottom: headline + call to action -->
      <div class="splash-content">
        <div class="splash-eyebrow">
          <span class="splash-eyebrow__line"></span>
          <p class="splash-eyebrow__text">Freshly made for you</p>
        </div>

        <h1 class="splash-title">Slow coffee.<br>Good moments.</h1>

        <p class="splash-description">
          Specialty drinks and freshly baked pastries, thoughtfully prepared when you order.
        </p>

        <a class="splash-cta" href="menu.html">
          Order Now
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" d="M5 12h14m-5-5 5 5-5 5" />
          </svg>
        </a>

        <div class="splash-services">
          <span class="splash-services__item">Dine In</span>
          <span class="splash-services__item">Take Out</span>
          <span class="splash-services__item">Table Service</span>
        </div>
      </div>
    </main>
  </body>
</html>
