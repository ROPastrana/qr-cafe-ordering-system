<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111113">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/tailwind.css">
    <title>Your Order | QR Cafe</title>
  </head>
  <body>
    <main class="app-shell screen screen-enter">
      <div class="cart-header">
        <a class="btn-back" href="menu.html" aria-label="Back to menu">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
          </svg>
        </a>
        <h1 class="page-title">Your Order</h1>
        <p class="page-subtitle mt-0.5">Review and confirm your table order</p>
      </div>

      <!-- Links back to orders already placed, one row each (filled by assets/js/order-bar.js) -->
      <nav id="order-bar" class="order-bars" aria-label="Your orders" hidden></nav>

      <div class="cart-content">
        <!-- Empty state -->
        <div id="cart-empty" class="empty-state" hidden>
          <p id="cart-empty-title" class="empty-state__title">Your cart is empty</p>
          <a class="empty-state__link" href="menu.html">Browse Menu →</a>
        </div>

        <!-- Filled state -->
        <div id="cart-filled" hidden>
          <div id="cart-items" class="cart-items-grid mb-5"></div>

          <div class="cart-total">
            <span>Total</span>
            <span id="cart-total-amount" class="amount"></span>
          </div>

          <label class="sr-only" for="customer-name">Name for your order</label>
          <input
            id="customer-name"
            class="text-input"
            type="text"
            maxlength="100"
            autocomplete="given-name"
            placeholder="Name for your order"
          >

          <!-- Dine In / Take Out (buttons built by cart.js) -->
          <div id="order-type" class="order-type" role="group" aria-label="Order type"></div>
        </div>
      </div>

      <div id="cart-footer" class="cart-footer" hidden>
        <p id="cart-error" class="cart-error" role="alert" hidden></p>
        <button id="place-order" class="btn-primary btn-primary--block" type="button" disabled>Place Order</button>
      </div>
    </main>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/store.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/order-bar.js"></script>
    <script src="assets/js/pages/cart.js"></script>
  </body>
</html>
