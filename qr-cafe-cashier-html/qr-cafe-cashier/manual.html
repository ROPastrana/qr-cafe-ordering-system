<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2b1810">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/tailwind.css">
    <title>Walk-In &amp; Manual Ordering | QR Cafe POS</title>
  </head>
  <body>
    <div class="app-shell">
      <!-- Sidebar is filled by assets/js/layout.js -->
      <aside id="sidebar" class="sidebar"></aside>

      <main class="app-main screen-enter">
        <header class="top-bar">
          <div>
            <h1 class="top-bar__title">Walk-In &amp; Manual Ordering</h1>
            <p class="top-bar__subtitle">Add items directly to construct table/dine-in orders</p>
          </div>
          <div class="top-bar__clock">
            <div id="clock-time" class="top-bar__time"></div>
            <div id="clock-date" class="top-bar__date"></div>
          </div>
        </header>

        <div class="manual-layout">
          <section class="menu-catalog" aria-label="Menu">
            <div id="category-tabs" class="category-tabs" role="group" aria-label="Menu categories"></div>
            <div id="menu-grid" class="menu-grid"></div>
          </section>

          <aside class="cart-panel" aria-label="Current cart order">
            <div class="cart-panel__head">
              <span class="cart-panel__title">Current Cart Order</span>
              <span id="fulfillment-badge"></span>
            </div>
            <div class="cart-panel__body">
              <div class="form-group">
                <label class="form-label" for="customer-name">Customer Name</label>
                <input id="customer-name" class="text-field" type="text" maxlength="100" placeholder="e.g. Alex C.">
              </div>
              <div class="form-group">
                <span id="fulfillment-label" class="form-label">Fulfillment</span>
                <div id="fulfillment" class="segmented segmented--block" role="group" aria-labelledby="fulfillment-label"></div>
              </div>
              <div id="cart-rows"></div>
            </div>
            <div id="cart-foot" class="cart-panel__foot"></div>
          </aside>
        </div>
      </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/store.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/modals.js"></script>
    <script src="assets/js/pages/manual.js"></script>
  </body>
</html>
