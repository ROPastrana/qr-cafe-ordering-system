<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2b1810">
    <!-- When the PHP backend is connected, add a server-generated CSRF token here:
         <meta name="csrf-token" content="..."> -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/tailwind.css">
    <title>Order Workspace | QR Cafe POS</title>
  </head>
  <body>
    <div class="app-shell">
      <!-- Sidebar is filled by assets/js/layout.js -->
      <aside id="sidebar" class="sidebar"></aside>

      <main class="app-main screen-enter">
        <header class="top-bar">
          <div>
            <h1 class="top-bar__title">Order Workspace</h1>
            <p class="top-bar__subtitle">Accept and settle payment for incoming QR/website orders</p>
          </div>
          <div class="top-bar__clock">
            <div id="clock-time" class="top-bar__time"></div>
            <div id="clock-date" class="top-bar__date"></div>
          </div>
        </header>

        <div class="split">
          <section class="workspace-list" aria-label="Incoming orders">
            <p class="workspace-list__title">Incoming Orders</p>
            <div id="order-list"></div>
          </section>
          <section id="workspace-detail" class="workspace-detail"></section>
        </div>
      </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/store.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/modals.js"></script>
    <script src="assets/js/pages/workspace.js"></script>
  </body>
</html>
